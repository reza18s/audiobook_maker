[package]
name = "audiobook-maker"
version = "0.1.0"
description = "Windows desktop client for Audiobook Maker"
authors = ["Audiobook Maker"]
edition = "2021"

[lib]
name = "audiobook_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
keyring = "3"
